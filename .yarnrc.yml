# Yarn Berry (4.x), the "yarn v2+" line.
#
# nodeLinker: node-modules — deliberately NOT Plug'n'Play.
# PnP is Berry's default and its main selling point, but it changes module
# resolution for every tool at once. Next 16, Tailwind v4's PostCSS plugin and
# the ESLint flat config all resolve differently under PnP, and switching
# package manager AND resolution strategy in one step makes any failure
# impossible to attribute. node-modules keeps this migration to one variable.
# Revisit PnP as its own change if the install size matters later.
nodeLinker: node-modules

# Keep the cache out of the repo. With node-modules there is no zero-install
# benefit to vendoring it, and it is large.
enableGlobalCache: true
